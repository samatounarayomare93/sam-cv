name: 24/7 Sovereign Telegram Dashboard

on:
  schedule:
    # Runs every 5 hours to ensure we don't exceed GitHub's 6 hour hard limit per job.
    # The concurrency hook cleanly kills the old one when the new one starts.
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  # This is the MAGIC key: It kills the old bot instantly when the new one starts.
  # This guarantees ZERO "Conflict: another instance is running" errors.
  group: sovereign-bot-dashboard
  cancel-in-progress: true

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Run up to the maximum 6 hours limit
    
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --prefer-binary

      - name: 🤖 Ignite Sovereign Dashboard
        env:
          # Email Delivery Secrets
          BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          
          # Telegram Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # AI Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
          # Core Configs
          ZERO_INVESTMENT_MODE: "true"
          USE_AI_ANALYSIS: "true"
        run: python launch_rita.py
