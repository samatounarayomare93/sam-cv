name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy (Account 2 - sam-bot-v2)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_ACC2 }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_ACC2 }}
        run: |
          echo "Triggering deploy on sam-bot-v2 (Account 2)..."
          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')
          echo "Deploy response: $RESPONSE"

      - name: Sync env vars to Render (Account 2)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_ACC2 }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_ACC2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ZOHO_SMTP_USER: ${{ secrets.ZOHO_SMTP_USER }}
          ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
          ZOHO_SMTP_USER_2: ${{ secrets.ZOHO_SMTP_USER_2 }}
          ZOHO_APP_PASSWORD_2: ${{ secrets.ZOHO_APP_PASSWORD_2 }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          echo "Syncing env vars to sam-bot-v2..."
          python3 - << 'PYEOF'
          import os, json, urllib.request

          svc = os.environ.get("RENDER_SERVICE_ID", "")
          key = os.environ.get("RENDER_API_KEY", "")

          env_vars = [
            {"key": "SUPABASE_URL",              "value": os.environ.get("SUPABASE_URL","")},
            {"key": "SUPABASE_KEY",              "value": os.environ.get("SUPABASE_KEY","")},
            {"key": "SUPABASE_SERVICE_ROLE_KEY", "value": os.environ.get("SUPABASE_KEY","")},
            {"key": "GROQ_API_KEY",              "value": os.environ.get("GROQ_API_KEY","")},
            {"key": "GEMINI_API_KEY",            "value": os.environ.get("GEMINI_API_KEY","")},
            {"key": "OPENROUTER_API_KEY",        "value": os.environ.get("OPENROUTER_API_KEY","")},
            {"key": "DEEPSEEK_API_KEY",          "value": os.environ.get("DEEPSEEK_API_KEY","")},
            {"key": "HUGGINGFACE_API_KEY",       "value": os.environ.get("HUGGINGFACE_API_KEY","")},
            {"key": "TELEGRAM_BOT_TOKEN",        "value": os.environ.get("TELEGRAM_BOT_TOKEN","")},
            {"key": "TELEGRAM_CHAT_ID",          "value": os.environ.get("TELEGRAM_CHAT_ID","")},
            {"key": "TELEGRAM_API_ID",           "value": os.environ.get("TELEGRAM_API_ID","")},
            {"key": "TELEGRAM_API_HASH",         "value": os.environ.get("TELEGRAM_API_HASH","")},
            {"key": "TELEGRAM_SESSION_STRING",   "value": os.environ.get("TELEGRAM_SESSION_STRING","")},
            {"key": "GMAIL_SMTP_USER",           "value": os.environ.get("GMAIL_SMTP_USER","")},
            {"key": "GMAIL_APP_PASSWORD",        "value": os.environ.get("GMAIL_APP_PASSWORD","")},
            {"key": "ZOHO_SMTP_USER",            "value": os.environ.get("ZOHO_SMTP_USER","")},
            {"key": "ZOHO_APP_PASSWORD",         "value": os.environ.get("ZOHO_APP_PASSWORD","")},
            {"key": "ZOHO_SMTP_USER_2",          "value": os.environ.get("ZOHO_SMTP_USER_2","")},
            {"key": "ZOHO_APP_PASSWORD_2",       "value": os.environ.get("ZOHO_APP_PASSWORD_2","")},
            {"key": "BREVO_API_KEY",             "value": os.environ.get("BREVO_API_KEY","")},
            {"key": "BREVO_SMTP_LOGIN",          "value": os.environ.get("BREVO_SMTP_LOGIN","")},
            {"key": "BREVO_SMTP_PASSWORD",       "value": os.environ.get("BREVO_SMTP_PASSWORD","")},
            {"key": "BREVO_SENDER_EMAIL",        "value": "samsalameh.cv@gmail.com"},
            {"key": "RESEND_API_KEY",            "value": os.environ.get("RESEND_API_KEY","")},
            {"key": "RESEND_FROM_EMAIL",         "value": "samsalameh.cv@gmail.com"},
            {"key": "RENDER_API_KEY",            "value": key},
            {"key": "RENDER_SERVICE_ID",         "value": svc},
            {"key": "RENDER_EXTERNAL_URL",       "value": "https://sam-bot-v2.onrender.com"},
            {"key": "RENDER",                    "value": "true"},
            {"key": "SENDER_NAME",               "value": "Sam Salameh"},
            {"key": "SENDER_EMAIL",              "value": "samsalameh.cv@gmail.com"},
            {"key": "CANDIDATE_NAME",            "value": "Sam Salameh"},
            {"key": "CANDIDATE_PHONE",           "value": "+961 70 841 1009"},
            {"key": "LINKEDIN_URL",              "value": "https://www.linkedin.com/in/sam-salameh"},
            {"key": "TEST_RECEIVER_EMAIL",       "value": "samsalameh.cv@gmail.com"},
            {"key": "KILL_SWITCH_ACTIVE",        "value": "false"},
            {"key": "MAX_PARALLEL_STRIKES",      "value": "3"},
            {"key": "MAX_EMAILS_PER_DAY",        "value": "1900"},
            {"key": "MAX_APPLICATIONS_PER_DAY",  "value": "1500"},
            {"key": "MAX_APPLICATIONS_PER_HOUR", "value": "120"},
            {"key": "MIN_MATCH_SCORE",           "value": "45"},
            {"key": "DIVINE_LOG_LEVEL",          "value": "INFO"},
            {"key": "USE_AI_ANALYSIS",           "value": "true"},
            {"key": "FOLLOWUP_ENABLED",          "value": "true"},
            {"key": "BUSINESS_HOURS_START",      "value": "5"},
            {"key": "BUSINESS_HOURS_END",        "value": "23"},
            {"key": "PORT",                      "value": "10000"},
          ]

          # Filter empty values
          env_vars = [e for e in env_vars if e["value"].strip()]

          data = json.dumps(env_vars).encode()
          req = urllib.request.Request(
            f"https://api.render.com/v1/services/{svc}/env-vars",
            data=data, method="PUT",
            headers={
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
              "Accept": "application/json"
            }
          )
          try:
            with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"✅ Env sync: HTTP {resp.status} - {len(env_vars)} vars synced")
          except Exception as e:
            print(f"⚠️ Env sync error: {e}")
          PYEOF
