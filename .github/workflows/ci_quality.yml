name: CI Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile smoke check
        run: |
          python -m py_compile \
            core/main_bot.py \
            core/ai_agent.py \
            core/db_client.py \
            core/telegram_dashboard.py \
            core/cv_tailor.py \
            core/pdf_generator.py \
            core/smtp_engine.py

      - name: Status report
        run: echo "Code Compilation Successful. Ready for Deployment."
