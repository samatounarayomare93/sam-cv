name: 🚀 UNLIMITED SWARM - Maximum Performance

on:
  schedule:
    # Run every 15 minutes for maximum throughput
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      agent_type:
        description: 'Agent type to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linkedin_scout
          - indeed_scout
          - bayt_scout
          - job_matcher
          - cover_letter_writer
          - email_delivery
          - response_tracker
          - follow_up
      batch_size:
        description: 'Batch size for processing'
        required: false
        default: '100'
        type: string

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # WAVE 1: SCOUT AGENTS (Parallel - Find Jobs)
  # ═══════════════════════════════════════════════════════════════════════════════
  scout-agents:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: 
          - linkedin_scout
          - indeed_scout
          - bayt_scout
          - glassdoor_scout
          - naukri_scout
          - wuzzuf_scout
          - daleel_madani_scout
          - jooble_scout
          - careerjet_scout
          - monster_scout
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download previous database
      uses: actions/download-artifact@v4
      with:
        name: swarm-database
        path: .
      continue-on-error: true
        
    - name: Run Scout Agent
      env:
        NODE_ID: ${{ github.run_id }}
        AGENT_TYPE: ${{ matrix.agent }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python unlimited_swarm.py --agent ${{ matrix.agent }} --mode single
        
    - name: Upload database
      uses: actions/upload-artifact@v4
      with:
        name: swarm-database-scout-${{ matrix.agent }}
        path: unlimited_swarm.db*
        retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # WAVE 2: AI AGENTS (Parallel - Analyze & Write)
  # ═══════════════════════════════════════════════════════════════════════════════
  ai-agents:
    runs-on: ubuntu-latest
    needs: scout-agents
    strategy:
      fail-fast: false
      matrix:
        agent:
          - job_matcher
          - cover_letter_writer
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download all scout databases
      uses: actions/download-artifact@v4
      with:
        path: ./dbs
        pattern: swarm-database-scout-*
      continue-on-error: true
        
    - name: Merge databases
      run: |
        python -c "
        import sqlite3
        import glob
        import os
        
        # Create main database
        main_db = 'unlimited_swarm.db'
        conn = sqlite3.connect(main_db)
        
        # Find all scout databases
        for db_file in glob.glob('./dbs/*/unlimited_swarm.db*'):
            try:
                conn.execute(f\"ATTACH DATABASE '{db_file}' AS source\")
                conn.execute('INSERT OR IGNORE INTO jobs SELECT * FROM source.jobs')
                conn.execute('DETACH DATABASE source')
            except:
                pass
        
        conn.commit()
        conn.close()
        print('Databases merged successfully')
        "
      continue-on-error: true
        
    - name: Run AI Agent
      env:
        NODE_ID: ${{ github.run_id }}
        AGENT_TYPE: ${{ matrix.agent }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
        CANDIDATE_EMAIL: ${{ secrets.CANDIDATE_EMAIL }}
      run: |
        python unlimited_swarm.py --agent ${{ matrix.agent }} --mode single
        
    - name: Upload database
      uses: actions/upload-artifact@v4
      with:
        name: swarm-database-ai-${{ matrix.agent }}
        path: unlimited_swarm.db*
        retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # WAVE 3: EMAIL AGENTS (Parallel - Send Applications)
  # ═══════════════════════════════════════════════════════════════════════════════
  email-agents:
    runs-on: ubuntu-latest
    needs: ai-agents
    strategy:
      fail-fast: false
      matrix:
        agent:
          - email_delivery
          - follow_up
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download AI databases
      uses: actions/download-artifact@v4
      with:
        path: ./dbs
        pattern: swarm-database-ai-*
      continue-on-error: true
        
    - name: Merge databases
      run: |
        python -c "
        import sqlite3
        import glob
        
        main_db = 'unlimited_swarm.db'
        conn = sqlite3.connect(main_db)
        
        for db_file in glob.glob('./dbs/*/unlimited_swarm.db*'):
            try:
                conn.execute(f\"ATTACH DATABASE '{db_file}' AS source\")
                conn.execute('INSERT OR IGNORE INTO jobs SELECT * FROM source.jobs')
                conn.execute('INSERT OR IGNORE INTO applications SELECT * FROM source.applications')
                conn.execute('DETACH DATABASE source')
            except:
                pass
        
        conn.commit()
        conn.close()
        "
      continue-on-error: true
        
    - name: Run Email Agent
      env:
        NODE_ID: ${{ github.run_id }}
        AGENT_TYPE: ${{ matrix.agent }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
        SMTP_SERVER_1: ${{ secrets.SMTP_SERVER_1 }}
        SMTP_USER_1: ${{ secrets.SMTP_USER_1 }}
        SMTP_PASS_1: ${{ secrets.SMTP_PASS_1 }}
        SMTP_SERVER_2: ${{ secrets.SMTP_SERVER_2 }}
        SMTP_USER_2: ${{ secrets.SMTP_USER_2 }}
        SMTP_PASS_2: ${{ secrets.SMTP_PASS_2 }}
        SMTP_SERVER_3: ${{ secrets.SMTP_SERVER_3 }}
        SMTP_USER_3: ${{ secrets.SMTP_USER_3 }}
        SMTP_PASS_3: ${{ secrets.SMTP_PASS_3 }}
        BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
        BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
        GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        OUTLOOK_USER: ${{ secrets.OUTLOOK_USER }}
        OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
        CANDIDATE_EMAIL: ${{ secrets.CANDIDATE_EMAIL }}
      run: |
        python unlimited_swarm.py --agent ${{ matrix.agent }} --mode single
        
    - name: Upload final database
      uses: actions/upload-artifact@v4
      with:
        name: swarm-database-final
        path: unlimited_swarm.db*
        retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════
  # NOTIFICATION
  # ═══════════════════════════════════════════════════════════════════════════════
  notify:
    runs-on: ubuntu-latest
    needs: [scout-agents, ai-agents, email-agents]
    if: always()
    
    steps:
    - name: Send Telegram notification
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "parse_mode=HTML" \
          -d "text=🚀 <b>Unlimited Swarm Cycle Complete</b>%0A%0A✅ Scout: ${{ needs.scout-agents.result }}%0A✅ AI: ${{ needs.ai-agents.result }}%0A✅ Email: ${{ needs.email-agents.result }}%0A%0A<i>Next cycle in 15 minutes</i>"
      continue-on-error: true
