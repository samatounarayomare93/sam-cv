services:
  - type: web
    name: sam-cv-bot
    runtime: python
    region: frankfurt # Preferred for Lebanon/Dubai proximity
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      # Core Services
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      
      # AI Services
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      
      # Email Services
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: ZOHO_SMTP_USER
        sync: false
      - key: ZOHO_APP_PASSWORD
        sync: false
      - key: YAHOO_SMTP_USER
        sync: false
      - key: YAHOO_APP_PASSWORD
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: OUTLOOK_USER
        sync: false
      - key: OUTLOOK_PASSWORD
        sync: false
      
      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      
      # System Config
      - key: CV_FILE_PATH
        value: Sam_Salameh_CV.html
      - key: USE_AI_ANALYSIS
        value: "true"
      - key: VERBOSE_LOGGING
        value: "true"
      - key: TEST_RECEIVER_EMAIL
        sync: false
      - key: SENDER_NAME
        value: Sam Salameh
      - key: CANDIDATE_NAME
        value: Sam Salameh
      - key: SENDER_EMAIL
        sync: false
      - key: CANDIDATE_PHONE
        value: +961 70 841 1009
      - key: LINKEDIN_URL
        value: https://www.linkedin.com/in/sam-salameh
      - key: CANDIDATE_PROFESSION
        value: Senior Network Engineer
      
      # Optimization Settings
      - key: MAX_EMAILS_PER_DAY
        value: "800"
      - key: MAX_EMAILS_PER_HOUR
        value: "33"
      - key: BREVO_DAILY_LIMIT
        value: "300"
      - key: ZOHO_DAILY_LIMIT
        value: "500"
      - key: AI_CACHE_ENABLED
        value: "true"
      - key: AI_CACHE_DURATION_HOURS
        value: "24"
      - key: MAX_PARALLEL_STRIKES
        value: "3"
      - key: MAX_QUALIFIED_LEADS_PER_CYCLE
        value: "100"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL
        value: "600"
      
      # Advanced Features
      - key: EMAIL_WARMUP_ENABLED
        value: "true"
      - key: FOLLOWUP_ENABLED
        value: "true"
      - key: FOLLOWUP_DAY3
        value: "true"
      - key: FOLLOWUP_DAY7
        value: "true"
      - key: FOLLOWUP_DAY14
        value: "true"
      - key: AB_TESTING_ENABLED
        value: "true"
      - key: RESPONSE_PREDICTION_ENABLED
        value: "true"
      - key: MIN_RESPONSE_CONFIDENCE
        value: "70"
      - key: LINKEDIN_SCRAPER_ENABLED
        value: "true"
      - key: NEWS_MONITOR_ENABLED
        value: "true"
      - key: EMAIL_PERSONALIZATION_ENABLED
        value: "true"
      - key: AUTO_LEARNING_ENABLED
        value: "true"
      - key: COMPETITOR_ANALYSIS_ENABLED
        value: "true"
      - key: SMART_SCHEDULER_ENABLED
        value: "true"
      - key: EMAIL_QUALITY_SCORER_ENABLED
        value: "true"
      - key: SOCIAL_PROOF_ENABLED
        value: "true"
