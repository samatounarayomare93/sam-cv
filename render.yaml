services:
  - type: web
    name: sam-job-automator
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: RENDER
        value: "true"
      - key: RENDER_EXTERNAL_URL
        value: "https://sam-job-automator.onrender.com"
