# Render deployment config
# NOTE: All env vars are managed via Render API (sync_all_to_account2.py)
# This file only defines build/start commands
services:
  - type: web
    name: sam-bot-v2
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python launch_sam.py
    healthCheckPath: /
    autoDeploy: true
