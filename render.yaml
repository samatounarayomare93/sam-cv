services:
  - type: web
    name: sam-job-automator
    runtime: python
    region: frankfurt # Preferred for Lebanon/Dubai proximity
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      # ── Core Database ──────────────────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxja2lhemJhZHltZWlrbXhlc2l0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NzMxNzE1NSwiZXhwIjoyMDkyODkzMTU1fQ.NWdt3IcKs60M-6T_syPLQU4m22msqugqGA7wZpCXNbg"
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxja2lhemJhZHltZWlrbXhlc2l0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NzMxNzE1NSwiZXhwIjoyMDkyODkzMTU1fQ.NWdt3IcKs60M-6T_syPLQU4m22msqugqGA7wZpCXNbg"

      # ── AI Services ────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false

      # ── Email: Brevo (primary HTTP API — works on Render) ──────────────────
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false

      # ── Email: Resend (requires verified custom domain) ────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_API_KEY_2
        sync: false
      - key: RESEND_API_KEY_3
        sync: false
      # RESEND_FROM_EMAIL must be a verified custom-domain address (NOT gmail.com)
      # Leave blank/unset if you don't have a verified domain — Brevo will be used instead
      - key: RESEND_FROM_EMAIL
        sync: false

      # ── Email: Zoho (SMTP blocked on Render; Zoho API works) ──────────────
      - key: ZOHO_SMTP_USER
        sync: false
      - key: ZOHO_APP_PASSWORD
        sync: false
      - key: ZOHO_SMTP_USER_2
        sync: false
      - key: ZOHO_APP_PASSWORD_2
        sync: false
      - key: ZOHO_API_KEY
        sync: false

      # ── Email: Mailjet HTTP API ────────────────────────────────────────────
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false

      # ── Email: SendPulse HTTP API ──────────────────────────────────────────
      - key: SENDPULSE_CLIENT_ID
        sync: false
      - key: SENDPULSE_CLIENT_SECRET
        sync: false

      # ── Email: Gmail (SMTP blocked on Render; Gmail API works) ────────────
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

      # ── Email: Yahoo / Outlook (SMTP — local only) ────────────────────────
      - key: YAHOO_SMTP_USER
        sync: false
      - key: YAHOO_APP_PASSWORD
        sync: false
      - key: OUTLOOK_USER
        sync: false
      - key: OUTLOOK_PASSWORD
        sync: false

      # ── Telegram ───────────────────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      # AUTHORIZED_CHATS: comma-separated list of allowed Telegram chat IDs
      - key: AUTHORIZED_CHATS
        sync: false

      # ── Render self-deploy API ─────────────────────────────────────────────
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: RENDER_EXTERNAL_URL
        value: https://sam-job-automator.onrender.com

      # ── Candidate Identity ─────────────────────────────────────────────────
      - key: SENDER_NAME
        value: Sam Salameh
      - key: CANDIDATE_NAME
        value: Sam Salameh
      - key: SENDER_EMAIL
        sync: false
      - key: TEST_RECEIVER_EMAIL
        sync: false
      - key: CANDIDATE_PHONE
        value: "+961 70 841 1009"
      - key: LINKEDIN_URL
        value: https://www.linkedin.com/in/sam-salameh
      - key: CANDIDATE_PROFESSION
        value: HR & Operations Manager

      # ── System Config ──────────────────────────────────────────────────────
      - key: CV_FILE_PATH
        value: Sam_Salameh_CV.html
      - key: USE_AI_ANALYSIS
        value: "true"
      - key: VERBOSE_LOGGING
        value: "true"

      # ── Throughput Controls ────────────────────────────────────────────────
      - key: MAX_EMAILS_PER_DAY
        value: "1900"
      - key: MAX_EMAILS_PER_HOUR
        value: "80"
      - key: BREVO_DAILY_LIMIT
        value: "300"
      - key: ZOHO_DAILY_LIMIT
        value: "500"
      - key: GMAIL_DAILY_LIMIT
        value: "500"
      - key: RESEND_DAILY_LIMIT
        value: "100"
      - key: MAX_PARALLEL_STRIKES
        value: "15"
      - key: MAX_QUALIFIED_LEADS_PER_CYCLE
        value: "300"
      - key: MAX_APPLICATIONS_PER_DAY
        value: "1500"
      - key: MAX_APPLICATIONS_PER_HOUR
        value: "120"
      - key: MIN_MATCH_SCORE
        value: "55"
      - key: QUALITY_THRESHOLD
        value: "55"
      - key: BATCH_SIZE
        value: "75"
      - key: BATCH_PROCESSING_ENABLED
        value: "true"
      - key: SCRAPE_INTERVAL_MINUTES
        value: "90"
      - key: MAX_PARALLEL_SCRAPERS
        value: "7"
      - key: MAX_SCRAPER_PAGES
        value: "120"
      - key: SCRAPER_DELAY_MIN
        value: "2"
      - key: SCRAPER_DELAY_MAX
        value: "6"
      - key: DELAY_BETWEEN_EMAILS_MIN
        value: "2"
      - key: DELAY_BETWEEN_EMAILS_MAX
        value: "8"
      - key: POISSON_MEAN_DELAY
        value: "4"
      - key: ENABLE_POISSON_TIMING
        value: "true"
      - key: BUSINESS_HOURS_START
        value: "5"
      - key: BUSINESS_HOURS_END
        value: "23"
      - key: ENABLE_CIRCADIAN_TIMING
        value: "true"
      - key: NATURAL_BREAK_PROBABILITY
        value: "0.05"
      - key: NATURAL_BREAK_MINUTES_MIN
        value: "2"
      - key: NATURAL_BREAK_MINUTES_MAX
        value: "5"
      - key: ENABLE_NATURAL_BREAKS
        value: "true"
      - key: KILL_SWITCH_ACTIVE
        value: "false"
      - key: SIMILARITY_THRESHOLD
        value: "0.90"
      - key: MIN_AI_CONFIDENCE
        value: "65"
      - key: GC_INTERVAL
        value: "90"
      - key: MEMORY_THRESHOLD_MB
        value: "450"

      # ── Keep-Alive (prevents Render free-tier sleep) ───────────────────────
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL
        value: "600"

      # ── AI Cache ───────────────────────────────────────────────────────────
      - key: AI_CACHE_ENABLED
        value: "true"
      - key: AI_CACHE_DURATION_HOURS
        value: "24"

      # ── Advanced Features ──────────────────────────────────────────────────
      - key: EMAIL_WARMUP_ENABLED
        value: "true"
      - key: FOLLOWUP_ENABLED
        value: "true"
      - key: FOLLOWUP_DAY3
        value: "true"
      - key: FOLLOWUP_DAY7
        value: "true"
      - key: FOLLOWUP_DAY14
        value: "true"
      - key: AB_TESTING_ENABLED
        value: "true"
      - key: RESPONSE_PREDICTION_ENABLED
        value: "true"
      - key: MIN_RESPONSE_CONFIDENCE
        value: "70"
      - key: LINKEDIN_SCRAPER_ENABLED
        value: "true"
      - key: NEWS_MONITOR_ENABLED
        value: "true"
      - key: EMAIL_PERSONALIZATION_ENABLED
        value: "true"
      - key: AUTO_LEARNING_ENABLED
        value: "true"
      - key: COMPETITOR_ANALYSIS_ENABLED
        value: "true"
      - key: SMART_SCHEDULER_ENABLED
        value: "true"
      - key: EMAIL_QUALITY_SCORER_ENABLED
        value: "true"
      - key: SOCIAL_PROOF_ENABLED
        value: "true"
